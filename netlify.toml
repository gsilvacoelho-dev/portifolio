# ---------------------------------------------------------------------------
# Netlify — site estático gerado pelo Vite.
# Equivalente ao public/.htaccess, que só funciona em Apache/LiteSpeed
# (Hostinger). Os dois podem coexistir: cada host lê o seu.
# ---------------------------------------------------------------------------

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --- Cache ------------------------------------------------------------------
# Os assets do Vite têm hash no nome: podem ser cacheados para sempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O HTML NUNCA pode ser cacheado, senão o deploy novo não aparece
# para quem já visitou o site.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# --- Segurança --------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# --- Página única -----------------------------------------------------------
# Qualquer caminho desconhecido volta para a raiz (o site não tem rotas).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
